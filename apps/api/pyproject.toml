[project]
name = "jori-api"
version = "0.0.0"
description = "조리읍 주민자치센터 수강시스템 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.33",
    "pyzipper>=0.4.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# 생성 파일은 생성기가 서식을 정하므로 서식 도구가 건드리지 않는다
extend-exclude = ["app/db/tables.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 실제 DB에 보내는 긴 SQL 문자열을 한 줄로 두는 시험 도우미
"tests/test_schema_*.py" = ["E501"]
"tests/factory.py" = ["E501"]
# SQLAlchemy 식의 ==는 SQL 식을 만드는 연산자라 좌우를 바꾸면 읽기 어렵다
"app/db/*.py" = ["SIM300"]
"app/auth/*.py" = ["SIM300"]
"app/auth/admin_access.py" = ["SIM300", "E501"]
"tests/test_admin_*.py" = ["SIM300", "E501"]
"tests/test_member_me*.py" = ["SIM300", "E501"]
"app/domain/admin/pii_export.py" = ["SIM300"]
"app/domain/admin/sms_purge.py" = ["SIM300"]
"app/tools/bootstrap.py" = ["SIM300"]
"app/tools/dev_member.py" = ["SIM300"]
"app/domain/member/name_change_service.py" = ["SIM300"]
"app/domain/admin/stats_input_service.py" = ["SIM300"]
"app/domain/admin/satisfaction_input_service.py" = ["SIM300"]
"app/domain/admin/member_service.py" = ["SIM300", "E501"]
"app/domain/admin/board_service.py" = ["SIM300", "E501"]
"app/domain/admin/inquiry_service.py" = ["SIM300", "E501"]
"app/domain/admin/content_service.py" = ["SIM300", "E501"]
"app/domain/admin/facility_service.py" = ["SIM300", "E501"]
"app/domain/admin/class_service.py" = ["SIM300", "E501"]
"app/domain/admin/schedule_service.py" = ["SIM300", "E501"]
"app/domain/admin/attendance_service.py" = ["SIM300", "E501"]
"app/domain/admin/instructor_review_service.py" = ["SIM300", "E501"]
"app/domain/admin/reduction_service.py" = ["SIM300", "E501"]
"app/domain/reduction/service.py" = ["SIM300", "E501"]
"app/domain/instructor/service.py" = ["SIM300", "E501"]
"app/domain/board/review.py" = ["SIM300", "E501"]
"app/domain/admin/role_service.py" = ["SIM300", "E501"]
"app/domain/admin/stats_service.py" = ["SIM300", "E501"]
"app/domain/admin/sms_service.py" = ["SIM300", "E501"]
"app/domain/admin/setting_service.py" = ["SIM300", "E501"]
"app/domain/admin/stats_source_service.py" = ["SIM300", "E501"]
"app/domain/admin/permission_service.py" = ["SIM300", "E501"]
"app/domain/admin/retention_service.py" = ["SIM300", "E501"]
"app/domain/member/profile_service.py" = ["SIM300", "E501"]
"app/domain/admin/term_service.py" = ["SIM300", "E501"]
"app/domain/board/sanitize.py" = ["E501"]
"tests/test_auth_flow.py" = ["SIM300", "E501"]
"tests/test_otp.py" = ["SIM300", "E501"]
"tests/test_join_recovery.py" = ["SIM300", "E501"]
"tests/test_site_public.py" = ["SIM300", "E501"]
"app/domain/site/service.py" = ["SIM300", "E501"]
"app/domain/site/home.py" = ["SIM300", "E501"]
"app/domain/board/service.py" = ["SIM300", "E501"]
"app/domain/board/inquiry.py" = ["SIM300", "E501"]
"app/domain/file/service.py" = ["SIM300", "E501"]
"app/domain/file/member_service.py" = ["SIM300", "E501"]
"app/domain/file/owner.py" = ["SIM300", "E501"]
"app/domain/admin/source_approval.py" = ["SIM300"]  # 대문자 SQLAlchemy 컬럼 비교를 요다로 뒤집지 않게 한다  # admin/file_service.py에서 옮긴 코드가 받던 면제를 그대로 이어받는다
"app/domain/application/*.py" = ["SIM300", "E501"]
"app/domain/payment/service.py" = ["SIM300", "E501"]
"tests/test_payments_*.py" = ["SIM300", "E501"]
"app/domain/refund/service.py" = ["SIM300", "E501"]
