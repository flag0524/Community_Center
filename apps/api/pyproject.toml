[project]
name = "jori-api"
version = "0.0.0"
description = "조리읍 주민자치센터 수강시스템 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 실제 DB에 보내는 긴 SQL 문자열을 한 줄로 두는 시험 도우미
"tests/test_schema_*.py" = ["E501"]
"tests/factory.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "concurrency: 실제 MariaDB와 스레드가 필요한 동시성 시험",
    "db: 실제 MariaDB가 필요한 시험(scripts/db/mariadb-dev.ps1 start)",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
