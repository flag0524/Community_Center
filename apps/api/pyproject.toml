"app/domain/admin/transaction_service.py" = ["SIM300", "E501"]
"app/domain/admin/education_service.py" = ["SIM300", "E501"]
"app/worker/*.py" = ["SIM300", "E501"]
"app/adapters/scan/*.py" = ["E501"]
"app/files/storage.py" = ["E501"]
"app/routers/health.py" = ["SIM300", "E501"]
"app/domain/admin/csv_export.py" = ["SIM300", "E501"]
"app/domain/admin/file_service.py" = ["SIM300", "E501"]
"app/domain/file/upload.py" = ["E501"]
"tests/test_files_*.py" = ["SIM300", "E501"]
"tests/test_admin_csv_*.py" = ["SIM300", "E501"]
"tests/test_worker_*.py" = ["SIM300", "E501"]
"tests/test_refunds_*.py" = ["SIM300", "E501"]
"tests/test_applications_*.py" = ["SIM300", "E501"]
"app/domain/course/service.py" = ["SIM300", "E501"]
"tests/test_courses_public.py" = ["SIM300", "E501"]
"tests/test_board_public.py" = ["SIM300", "E501"]
"tests/test_home_public.py" = ["SIM300", "E501"]
"tests/test_db_foundation.py" = ["SIM300"]
"app/routers/**/auth.py" = ["SIM300"]
"app/domain/site/facility.py" = ["SIM300"]
"tests/test_site_facilities.py" = ["SIM300"]
# 생성 파일이라 설계안의 문구를 그대로 둔다
"app/db/tables.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# 타입 정보를 싣지 않은 외부 라이브러리
module = ["apscheduler.*", "pyzipper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "concurrency: 실제 MariaDB와 스레드가 필요한 동시성 시험",
    "db: 실제 MariaDB가 필요한 시험(scripts/db/mariadb-dev.ps1 start)",
]

[tool.coverage.run]
source = ["app"]
# 줄 커버리지만 잰다. 분기 측정은 느려 전체 시험이 3~5배 길어진다(Python 3.12의 sysmon은 분기를 지원하지 않는다)
branch = false
# 생성 파일은 시험 대상이 아니다
omit = ["app/db/tables.py"]

[tool.coverage.report]
# 2026-11-20 측정 줄 커버리지 98%. 크게 떨어지는 변경을 CI에서 잡는 하한이다
fail_under = 95
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7",
    "ruff>=0.17.3",
]
