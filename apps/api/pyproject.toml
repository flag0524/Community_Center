[project]
name = "jori-api"
version = "0.0.0"
description = "조리읍 주민자치센터 수강시스템 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["concurrency: 실제 MariaDB와 스레드가 필요한 동시성 시험"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
