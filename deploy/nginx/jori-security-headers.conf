# /etc/nginx/snippets/jori-security-headers.conf 로 둔다. 두 사이트가 같이 쓴다.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 코드 리뷰 보안 중-5. 빌드 산출물에 인라인 스크립트·스타일과 외부 주소가 없어 전부 자기 출처로 좁힌다.
# img-src의 data:는 Vite가 작은 이미지를 문자열로 넣는 경우를 위한 것이다.
# TBD: PG 결제창(스크립트·프레임·리다이렉트)과 지도 공급자가 정해지면 script-src·frame-src·form-action에 그 주소만 더한다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
