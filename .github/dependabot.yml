# 의존성의 새 버전과 보안 갱신을 GitHub가 매주 확인해 PR로 알리게 하는 설정(2026-11-26 코드 리뷰 보통-2)
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm 작업공간 전체
    directory: /
    schedule:
      interval: weekly
    ignore: # React 18이 기준이다(TDD). 큰 버전 올림은 제안받지 않고 사람이 정한다
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Node 타입은 지원하는 가장 낮은 Node 22에 맞춘다. 높은 타입은 22에 없는 기능을 통과시킨다
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
